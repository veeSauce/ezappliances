version: '3.8'

services:
  # 1. POSTGRESQL DATABASE SERVICE
  postgres_db:
    image: postgres:15-alpine
    container_name: ezappliances_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Auto-run schema.sql on first container start
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - ez_network

  # 2. NODE.JS WEB APP SERVICE
  web_app:
    build: .
    container_name: ezappliances_app
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - postgres_db
    networks:
      - ez_network

volumes:
  postgres_data:

networks:
  ez_network:
    driver: bridge
