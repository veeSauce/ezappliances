<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard — EZ Appliances</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <main class="admin-shell">
    <div class="admin-topbar">
      <div><span class="eyebrow">Admin dashboard</span><h1>Operations</h1></div>
      <button id="adminLogoutButton" class="btn btn-outline" type="button">Log out</button>
    </div>
    <div class="admin-tabs" role="tablist" aria-label="Dashboard views">
      <button class="admin-tab active" type="button" data-admin-view="customers" role="tab" aria-selected="true">Customers</button>
      <button class="admin-tab" type="button" data-admin-view="inventory" role="tab" aria-selected="false">Inventory</button>
    </div>
    <div id="sessionWarning" class="session-warning" role="alert" aria-live="polite"></div>
    <p class="form-status" id="adminStatus" role="status"></p>

    <section id="customersView" class="admin-view" role="tabpanel">
      <h2>Customer records</h2>
      <div class="admin-table-wrap"><table>
        <thead><tr><th>Name</th><th>Address</th><th>Phone</th><th>Units</th><th>Installation</th><th>Billing start</th><th>Past due</th></tr></thead>
        <tbody id="adminCustomersTableBody"><tr><td colspan="7" class="muted">Loading customers…</td></tr></tbody>
      </table></div>
    </section>

    <section id="inventoryView" class="admin-view" role="tabpanel" hidden>
      <h2>Appliance inventory</h2>
      <p>Click an assigned appliance to open its customer record.</p>
      <form id="addInventoryForm" class="customer-card">
        <h3>Add appliance</h3>
        <div class="assignment-fields">
          <label>Unit type<select name="type" required><option value="washer">Washer</option><option value="dryer">Dryer</option><option value="stacked_dryer">Stacked unit</option></select></label>
          <label>Serial number<input name="serialNumber" type="text" required></label>
          <label>Make<input name="make" type="text" required></label>
        </div>
        <div class="assignment-actions"><button class="btn btn-amber" type="submit">Add to inventory</button></div>
      </form>
      <div class="admin-table-wrap"><table>
        <thead><tr><th>Type</th><th>Model</th><th>Serial number</th><th>Status</th><th>Assigned to</th></tr></thead>
        <tbody id="adminInventoryTableBody"><tr><td colspan="5" class="muted">Choose Inventory to load appliances.</td></tr></tbody>
      </table></div>
    </section>
  </main>
  <script src="/js/main.js"></script>
</body>
</html>
