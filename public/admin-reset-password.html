<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Admin Password — EZ Appliances</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; background: #eef0ee; }
    .reset-card { width: min(440px, calc(100vw - 32px)); background: #fbfcfb; border: 1px solid rgba(27,35,32,.14); border-radius: 8px; box-shadow: 0 8px 24px rgba(27,35,32,.08); padding: 32px; }
    .reset-card h1 { margin-bottom: 8px; }
    .reset-card p { margin-bottom: 20px; }
    .reset-step + .reset-step { border-top: 1px solid rgba(27,35,32,.14); margin-top: 28px; padding-top: 28px; }
  </style>
</head>
<body>
  <main class="reset-card">
    <span class="eyebrow">Admin access</span>
    <h1>Reset password</h1>
    <section class="reset-step">
      <h2>1. Request a code</h2>
      <p>A one-time code will be sent to the admin recovery inbox and expires in 15 minutes.</p>
      <form id="adminPasswordRequestForm" novalidate>
        <div class="form-row">
          <label for="adminIdentifier">Username or email</label>
          <input id="adminIdentifier" name="identifier" type="text" autocomplete="username" required />
        </div>
        <button class="btn btn-outline" type="submit">Email reset code</button>
        <p class="form-status" id="adminPasswordRequestStatus" role="status"></p>
      </form>
    </section>
    <section class="reset-step">
      <h2>2. Set a new password</h2>
      <form id="adminPasswordResetForm" novalidate>
        <div class="form-row">
          <label for="resetCode">One-time code</label>
          <input id="resetCode" name="code" type="text" autocomplete="one-time-code" autocapitalize="characters" required />
        </div>
        <div class="form-row">
          <label for="newPassword">New password</label>
          <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="12" required />
        </div>
        <div class="form-row">
          <label for="confirmPassword">Confirm new password</label>
          <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="12" required />
        </div>
        <button class="btn btn-amber" type="submit">Reset password</button>
        <p class="form-status" id="adminPasswordResetStatus" role="status"></p>
      </form>
    </section>
    <p><a href="/admin-login.html">Back to sign in</a></p>
  </main>
  <script src="/js/main.js"></script>
</body>
</html>
