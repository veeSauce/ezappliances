<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer Dashboard — EZ Appliances</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>body{min-height:100vh;display:grid;place-items:center;background:#eef0ee}.portal-card{width:min(440px,calc(100vw - 32px));padding:32px;background:#fbfcfb;border:1px solid rgba(27,35,32,.14);border-radius:8px;box-shadow:0 8px 24px rgba(27,35,32,.08)}</style>
</head>
<body>
  <main class="portal-card">
    <span class="eyebrow">Customer account</span>
    <h1>View your account</h1>
    <p>Sign in with the email address and ZIP code associated with your billing address.</p>
    <form id="customerLoginForm" novalidate>
      <div class="form-row"><label for="customerEmail">Email address</label><input id="customerEmail" name="email" type="email" autocomplete="email" required></div>
      <div class="form-row"><label for="customerZip">Billing ZIP code</label><input id="customerZip" name="zip" type="text" inputmode="numeric" autocomplete="postal-code" maxlength="5" required></div>
      <button class="btn btn-amber" type="submit">View dashboard</button>
      <p id="customerLoginStatus" class="form-status" role="status"></p>
    </form>
    <p><a href="/">Back to EZ Appliances</a></p>
  </main>
  <script src="/js/main.js"></script>
</body>
</html>
