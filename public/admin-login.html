<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — EZ Appliances</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #eef0ee;
    }
    .login-card {
      width: min(440px, calc(100vw - 32px));
      background: #fbfcfb;
      border: 1px solid rgba(27,35,32,0.14);
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(27,35,32,0.08);
      padding: 32px;
    }
    .login-card h1 {
      margin-bottom: 8px;
    }
    .login-card p {
      margin-bottom: 20px;
    }
    .auth-actions {
      display: flex;
      gap: 12px;
      margin-top: 18px;
      align-items: center;
    }
    .session-banner {
      display: none;
      margin: 0 0 18px;
      padding: 12px 14px;
      border-radius: 6px;
      border: 1px solid rgba(178, 59, 59, 0.2);
      background: rgba(178, 59, 59, 0.08);
      color: #7a1c1c;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .session-banner.visible {
      display: block;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <span class="eyebrow">Admin access</span>
    <div id="sessionBanner" class="session-banner" role="alert" aria-live="polite"></div>
    <h1>Sign in</h1>
    <p>Use your EZ Appliances admin account to view customer records.</p>

    <form id="adminLoginForm" novalidate>
      <div class="form-row">
        <label for="adminUsername">Username or email</label>
        <input id="adminUsername" name="username" type="text" autocomplete="username" required />
      </div>

      <div class="form-row">
        <label for="adminPassword">Password</label>
        <input id="adminPassword" name="password" type="password" autocomplete="current-password" required />
      </div>

      <div class="auth-actions">
        <button type="submit" class="btn btn-amber">Log in</button>
      </div>

      <p class="form-status" id="adminLoginStatus" role="status"></p>
    </form>
  </div>

  <script>
    const message = sessionStorage.getItem('adminLoginMessage');
    if (message) {
      const banner = document.getElementById('sessionBanner');
      const statusEl = document.getElementById('adminLoginStatus');
      if (banner) {
        banner.textContent = message;
        banner.classList.add('visible');
      }
      if (statusEl) {
        statusEl.textContent = message;
        statusEl.classList.add('visible', 'error');
      }
      sessionStorage.removeItem('adminLoginMessage');
    }
  </script>
  <script src="/js/main.js"></script>
</body>
</html>
